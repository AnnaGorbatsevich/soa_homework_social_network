version: "3"

services:
  postgres_content:
    image: postgres:latest
    container_name: postgres_content
    environment:
      POSTGRES_USER: gorbanna
      POSTGRES_PASSWORD: my_super_password
      POSTGRES_DB: fast_api_content
      PGDATA: /var/lib/postgresql/data_content/pgdata
    ports:
      - "5430:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data_content/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gorbanna -d fast_api_content" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

volumes:
  pgdata2:
    driver: local